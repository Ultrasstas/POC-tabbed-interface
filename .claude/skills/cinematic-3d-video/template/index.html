  html, body { margin: 0; background: #000; overflow: hidden; }
  #frame { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); transform-origin: 0 0; overflow: hidden; }

  .cap .w.dim { color: rgba(255,255,255,.42); }
  .cap .w i { font-style: normal; color: #7dffb0; }           /* accent punctuation */

  /* Callout labels: small caps + hairline leader. */
  .leaders { position: absolute; inset: 0; width: 100%; height: 100%; }
  .leaders path { stroke: rgba(255,255,255,.9); fill: none; }
  .leaders circle { fill: #fff; }
  .label { position: absolute; font-weight: 600; font-size: calc(24 * var(--u)); letter-spacing: .22em;

           text-shadow: 0 0 calc(12 * var(--u)) rgba(0,0,0,.7); }
  .note { position: absolute; left: calc(40 * var(--u)); bottom: calc(60 * var(--u)); font-size: calc(20 * var(--u));

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>cutout-story-video</title>
<link rel="stylesheet" href="./node_modules/@fontsource-variable/manrope/index.css">
<link rel="stylesheet" href="./node_modules/@fontsource-variable/oswald/index.css">
<link rel="stylesheet" href="./node_modules/@fontsource-variable/caveat/index.css">
<link rel="stylesheet" href="./node_modules/@fontsource/dela-gothic-one/index.css">
<link rel="stylesheet" href="./node_modules/@fontsource/rubik-dirt/index.css">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #frame { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); transform-origin: 0 0; overflow: hidden; background: #000; }
  #stage, .scene { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; will-change: transform; }
  .layer.full { inset: 0; }
  .layer.full > img { width: 100%; height: 100%; display: block; }
  .layer > img { display: block; user-select: none; }
  #grain { position: absolute; inset: 0; z-index: 9000; mix-blend-mode: overlay; pointer-events: none; }
  .flash { position: absolute; inset: 0; z-index: 800; opacity: 0; background: #fff; }
  /* comic speed lines: radial wedges, re-rotated 12x per second by the engine */
  .speedlines { position: absolute; inset: -30%; z-index: 700; opacity: 0;
    background: repeating-conic-gradient(from var(--rot, 0deg), transparent 0deg 5.2deg, var(--line, rgba(0,0,0,.55)) 5.6deg 6.4deg, transparent 6.8deg 11deg, var(--line, rgba(0,0,0,.55)) 11.2deg 11.5deg, transparent 11.8deg 17deg);
    -webkit-mask-image: radial-gradient(circle, transparent 0 30%, #000 62%); mask-image: radial-gradient(circle, transparent 0 30%, #000 62%); }

  /* ---------- text styles ---------- */
  .txt { white-space: nowrap; text-align: center; line-height: 1; color: #fff; }
  .txt .g { display: inline-block; white-space: pre; }
  /* title: tall condensed poster caps */
  .txt-title { font-family: 'Oswald Variable', sans-serif; font-weight: 700; font-size: calc(190 * var(--u)); text-transform: uppercase; letter-spacing: -0.01em; line-height: .95;
               text-shadow: 0 calc(8 * var(--u)) 0 rgba(0,0,0,.85), 0 calc(10 * var(--u)) calc(40 * var(--u)) rgba(0,0,0,.45); -webkit-text-stroke: calc(3 * var(--u)) rgba(0,0,0,.9); paint-order: stroke fill; }
  /* heavy: wide, loud, one or two words */
  .txt-heavy { font-family: 'Dela Gothic One', sans-serif; font-size: calc(170 * var(--u)); text-transform: uppercase; line-height: 1.02; color: #e10600; }
  /* brush: dirty hand-painted word, usually black on a flat colour card */
  .txt-brush { font-family: 'Rubik Dirt', sans-serif; font-size: calc(230 * var(--u)); text-transform: uppercase; color: #111; letter-spacing: .01em; }
  /* tag: small label ("третий принцип", "январь 1992 г.") */
  .txt-tag { font-family: 'Manrope Variable', sans-serif; font-weight: 800; font-size: calc(34 * var(--u)); background: #111; color: #ffe500; padding: .35em .7em .4em; border-radius: calc(8 * var(--u)); }
  /* card: white note with a statement */
  .txt-card { font-family: 'Oswald Variable', sans-serif; font-weight: 700; font-size: calc(84 * var(--u)); text-transform: uppercase; background: #fff; color: #111; padding: .25em .45em .3em; line-height: 1.05; text-align: left;
              box-shadow: calc(10 * var(--u)) calc(10 * var(--u)) 0 rgba(0,0,0,.85); border: calc(5 * var(--u)) solid #111; }
  /* bubble: comic speech balloon */
  .txt-bubble { font-family: 'Manrope Variable', sans-serif; font-weight: 800; font-size: calc(44 * var(--u)); color: #111; background: #fff; padding: .55em .9em .6em; line-height: 1.12;
                border: calc(6 * var(--u)) solid #111; border-radius: 1.2em; position: relative; white-space: normal; max-width: calc(620 * var(--u)); }
  .txt-bubble::after { content: ''; position: absolute; bottom: calc(-40 * var(--u)); width: calc(46 * var(--u)); height: calc(46 * var(--u)); background: #fff;
                border-right: calc(6 * var(--u)) solid #111; border-bottom: calc(6 * var(--u)) solid #111; transform: skewX(28deg) rotate(18deg); transform-origin: top left; left: 22%; clip-path: polygon(0 55%, 100% 0, 100% 100%, 0 100%); display: none; }
  .txt-bubble.tail-left::after { display: block; left: 20%; }
  .txt-bubble.tail-right::after { display: block; left: auto; right: 26%; transform: scaleX(-1) skewX(28deg) rotate(18deg); transform-origin: top right; }
  /* caption: running subtitle at the bottom */
  .txt-caption { font-family: 'Manrope Variable', sans-serif; font-weight: 800; font-size: calc(58 * var(--u)); line-height: 1.1; white-space: normal; max-width: calc(1500 * var(--u));
                 -webkit-text-stroke: calc(10 * var(--u)) #111; paint-order: stroke fill; }
  /* sticker: round-cornered stamp, rotate it with `rotate` */
  .txt-sticker { font-family: 'Oswald Variable', sans-serif; font-weight: 700; font-size: calc(62 * var(--u)); text-transform: uppercase; background: #ffe500; color: #111; padding: .3em .6em .35em; border: calc(6 * var(--u)) solid #111; border-radius: calc(18 * var(--u)); box-shadow: calc(8 * var(--u)) calc(8 * var(--u)) 0 #111; }
  /* hand: handwriting note / arrow label */
  .txt-hand { font-family: 'Caveat Variable', cursive; font-weight: 700; font-size: calc(80 * var(--u)); color: #111; }
</style>
</head>
<body>
<div id="frame"><div id="stage"></div><div id="grain"></div></div>
<script type="module">
  import { boot } from './lib/engine.js';
  import story from './story.js';
  boot(story).catch((e) => { console.error(e); window.__error = String(e && e.stack || e); });
</script>
</body>
</html>
